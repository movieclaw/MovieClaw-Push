# movieclaw-push 官方部署配置。
#
# 官方中继 = 这份开源代码 + 这份配置 + 官方的 .p8，不维护私有分支。
# 实例凭证由 MovieClaw 的 api 签发（Ed25519 JWT），中继本地验签；
# 公钥和吊销名单每 5 分钟拉一次并写到磁盘，api 宕机期间即使中继重启，推送也不受影响。

listen: ":8080"

# 实例令牌的 aud 必须等于它。不随实例实际访问的地址变化，主备中继共用一个值。
aud: https://push.movieclaw.example

data_dir: /data

apns:
  keys:
    - team_id: ABCDE12345
      key_id: XYZ987WVUT
      file: /secrets/AuthKey_XYZ987WVUT.p8
  topics: [io.movieclaw.app]
  types: [alert]   # 规则表见 docs/protocol.md「推送类型」

auth:
  mode: issuer
  issuers:
    - iss: https://api.movieclaw.example
      jwks: https://api.movieclaw.example/jwks.json
      revocations: https://api.movieclaw.example/v1/push/revocations
      key_file: /secrets/relay-key     # 调吊销名单用的中继专用密钥
  cache_dir: /data/auth-cache          # 公钥和吊销名单落盘
  refresh_interval: 5m                 # 解绑在这个时间内生效

# 令牌里没有 lim 时用的默认限额。
limits:
  day: 5000
  device_day: 500

admin:
  key_file: /secrets/admin-key         # api 每小时拉 /admin/v1/usage 用

log:
  level: info
